name: triage-issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Auto-add labels por palabras clave
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue.title || '').toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = title + '\n' + body;

            const rules = [
              { label: 'bug', keywords: ['bug', 'error', 'falla', 'fallo', 'no funciona', 'no funca', 'crash', 'broken', 'rompe', 'mal', 'arreglar', 'fix'] },
              { label: 'enhancement', keywords: ['mejora', 'mejorar', 'feature', 'a\u00f1adir', 'agregar', 'nueva', 'nuevo', 'power-up', 'skin', 'nivel', 'sugerencia'] },
              { label: 'documentation', keywords: ['documentaci\u00f3n', 'documentacion', 'doc', 'docs', 'readme', 'manual', 'gu\u00eda', 'guia'] },
              { label: 'question', keywords: ['c\u00f3mo', 'como', 'duda', 'pregunta', 'question', 'ayuda', 'help', '?', '\u00bf'] }
            ];

            const labels = rules
              .filter(({ keywords }) => keywords.some((keyword) => text.includes(keyword)))
              .map(({ label }) => label);

            if (labels.length === 0) {
              console.log('No se detectaron etiquetas.');
              return;
            }

            const { owner, repo } = context.repo;
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: context.payload.issue.number,
              labels
            });
            console.log('Etiquetas aplicadas: ' + labels.join(', '));

      - name: Publicar comentario con contexto y estado del repositorio
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;

            const repoInfo = await github.rest.repos.get({ owner, repo });
            const commits = await github.rest.repos.listCommits({ owner, repo, per_page: 1 });
            const lastCommit = commits.data[0];

            const lines = [
              '---',
              `*Comentario autom\u00e1tico generado por el workflow \`triage-issue\`. No modifica el texto original del issue.*`,
              '',
              '### Contexto del proyecto',
              '- Clon del cl\u00e1sico arcade **Asteroids** en HTML5 Canvas puro, sin dependencias ni bundler.',
              '- Toda la l\u00f3gica del juego est\u00e1 en `game.js`; la pantalla se define en `index.html`.',
              '- Para reproducir: abre `index.html` en el navegador o `npx serve .` y visita http://localhost:3000.',
              '- Comenta con `/oc` o `/opencode` para que un agente de opencode resuelva el issue autom\u00e1ticamente.',
              '',
              '### Estado del repositorio',
              `- Rama por defecto: \`${repoInfo.data.default_branch}\``,
              `- \u00daltimo commit: \`${lastCommit.sha.slice(0, 7)}\` (${lastCommit.commit.message.split('\n')[0]}) — ${lastCommit.commit.author.date}`,
              `- Autor del issue: @${issue.user.login} — creado el ${issue.created_at}`,
              ''
            ];

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: lines.join('\n')
            });
            console.log('Comentario de triaje publicado.');