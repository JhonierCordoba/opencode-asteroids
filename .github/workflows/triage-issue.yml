name: triage-issue

on:
  issues:
    types: [opened]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  triage:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Aplicar etiquetas
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue.title || '').toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = title + '\n' + body;

            const rules = [
              { label: 'bug', keywords: ['bug', 'error', 'falla', 'fallo', 'no funciona', 'no funca', 'crash', 'broken', 'rompe', 'mal', 'arreglar', 'fix'] },
              { label: 'enhancement', keywords: ['mejora', 'mejorar', 'feature', 'a\u00f1adir', 'agregar', 'nueva', 'nuevo', 'power-up', 'skin', 'nivel', 'sugerencia'] },
              { label: 'documentation', keywords: ['documentaci\u00f3n', 'documentacion', 'doc', 'docs', 'readme', 'manual', 'gu\u00eda', 'guia'] },
              { label: 'question', keywords: ['c\u00f3mo', 'como', 'duda', 'pregunta', 'question', 'ayuda', 'help', '?', '\u00bf'] }
            ];

            let labels = rules
              .filter(({ keywords }) => keywords.some((keyword) => text.includes(keyword)))
              .map(({ label }) => label);

            const { owner, repo } = context.repo;
            if (labels.length === 0) {
              labels = ['needs-triage'];
              try {
                await github.rest.issues.getLabel({ owner, repo, name: 'needs-triage' });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: 'needs-triage',
                    color: 'fbca04',
                    description: 'Requiere revisi\u00f3n inicial'
                  });
                } else {
                  throw error;
                }
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: context.payload.issue.number,
              labels
            });
            console.log('Etiquetas aplicadas: ' + labels.join(', '));

      - name: Analizar issue y publicar gu\u00eda de implementaci\u00f3n
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: |
            Analiza el issue reci\u00e9n creado y publica un \u00fanico comentario en espa\u00f1ol.
            No abras ramas ni PRs; no modifiques el texto original del issue.
            El comentario debe incluir:
            1. Descripci\u00f3n detallada del issue: qu\u00e9 se pide, comportamiento esperado vs. actual y qu\u00e9 partes del juego afectan (revisa game.js e index.html).
            2. Gu\u00eda de implementaci\u00f3n paso a paso: archivos a modificar, enfoque sugerido y trampas conocidas (por ejemplo, mantener sincronizados W/H en game.js con el tama\u00f1o del <canvas> de index.html).
            3. Criterios de aceptaci\u00f3n para saber cu\u00e1ndo el issue est\u00e1 resuelto.
